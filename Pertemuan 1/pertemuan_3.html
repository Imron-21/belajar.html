<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strong, Emphasis dan Blockquote</title>
  </head>
  <body>
    <!-- Strong -->

    <p><strong>Perhatian:</strong> Jangan Buang Sampah Sembarangan</p>

    <!-- Blockquote -->
    <blockquote>
      <p>
        "Kebahagiaan bukanlah hal yang kamu cari, tetapi hal yang kamu
        ciptakan."
      </p>
    </blockquote>

    <!-- Emphesis -->
    <!-- quote -->
    <p>
      Ini adalah tempat <em>nongkrong</em> bukan tempat
      <strong>berantem</strong>. <q>Selalu jaga kesehatan</q>
    </p>
  </body>
</html>
